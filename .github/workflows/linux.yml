# QGroundControl x86_64-only AppImage build for the Steam Deck rover branch.
# Replace .github/workflows/linux.yml with this file.
name: Linux x86_64 AppImage

on:
  push:
    branches:
      - feature/steamdeck-rover-gimbal
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: qgc-appimage-x86_64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-x86_64:
    name: Build QGroundControl x86_64 AppImage
    # Manual runs must also select the modified rover branch.
    if: github.ref == 'refs/heads/feature/steamdeck-rover-gimbal'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      # Run AppImage packaging tools on hosted runners without requiring FUSE.
      APPIMAGE_EXTRACT_AND_RUN: '1'

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout QGroundControl
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Qt and build tools
        uses: ./.github/actions/build-setup
        with:
          qt-host: linux
          qt-arch: linux_gcc_64
          build-type: Release

      - name: Install Linux dependencies
        uses: ./.github/actions/install-dependencies

      - name: Configure x86_64 Release build
        uses: ./.github/actions/cmake-configure
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release
          preset: Linux
          extra-args: -DQGC_CREATE_APPIMAGE=ON

      - name: Compile QGroundControl
        run: cmake --build "${RUNNER_TEMP}/build" --config Release --parallel 4

      - name: Package AppImage
        uses: ./.github/actions/cmake-install
        with:
          build-dir: ${{ runner.temp }}/build
          build-type: Release

      - name: Verify x86_64 AppImage
        uses: ./.github/actions/verify-executable
        with:
          binary-path: ${{ runner.temp }}/build/QGroundControl-x86_64.AppImage
          type: appimage

      - name: Print SHA-256 checksum
        run: sha256sum "${RUNNER_TEMP}/build/QGroundControl-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: QGroundControl-x86_64
          path: ${{ runner.temp }}/build/QGroundControl-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
